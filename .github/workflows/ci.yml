name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: phytoagent-skills
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Offline demo
        working-directory: phytoagent-skills
        run: python -m demo.phytoforge_demo
      - name: Tests
        working-directory: phytoagent-skills
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: phytoagent-skills/pytest-results.xml
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security scan
        working-directory: phytoagent-skills
        run: |
          python -m pip install -q bandit pip-audit
          python -m bandit -r sdk registry runtime compiler shield corpus backends -f txt || true
          python -m pip-audit --skip-editable --strict || true
